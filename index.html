    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        min-height: 100%;
        background: #5147E5;
      }

      body {
        font-family: "Red Hat Display", system-ui, sans-serif;
        color: #010101;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

      .page {
        position: relative;
        width: 100%;
        max-width: 580px;
        margin: 0 auto;
        padding: 16px 16px 0;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      /* Top corner buttons */
      .topbar {
        display: flex;
        justify-content: space-between;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: rgba(0, 0, 0, .3);
        border: 1px solid rgba(255, 255, 255, .15);
        color: #fff;
        backdrop-filter: blur(8px);
        transition: background .15s ease;
      }

      .icon-btn:hover { background: rgba(0, 0, 0, .45); }
      .icon-btn svg { width: 20px; height: 20px; }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 32px;
      }

      .avatar {
        width: 96px;
        height: 96px;
        border-radius: 9999px;
        object-fit: contain;
      }

      h1 {
        margin-top: 16px;
        color: #fff;
        font-size: 24px;
        font-weight: 600;
        line-height: 1.3;
        text-align: center;
      }

      nav {
        width: 100%;
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Link buttons */
      .link {
        position: relative;
        transition: transform .12s ease;
      }

      .button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 64px;
        padding: 12px 48px;
        background: #fff;
        color: #010101;
        border: 1.75px solid #000;
        border-radius: 16px;
        box-shadow: 3px 4px 0 0 #000;
        font-size: 14px;
        font-weight: 500;
        text-align: center;
        text-decoration: none;
        transition: box-shadow .12s ease;
      }

      .link:hover { transform: translate(-1px, -1px); }
      .link:hover .button { box-shadow: 4px 5px 0 0 #000; }
      .link:active { transform: translate(3px, 4px); }
      .link:active .button { box-shadow: 0 0 0 0 #000; }

      .more {
        position: absolute;
        top: 50%;
        right: 12px;
        transform: translateY(-50%);
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 9999px;
        color: #6b6b6b;
      }

      .more:hover { background: rgba(0, 0, 0, .06); color: #010101; }
      .more svg { width: 16px; height: 16px; }

      .button:focus-visible, .icon-btn:focus-visible, .more:focus-visible, .sheet button:focus-visible, .sheet a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
      .more:focus-visible, .sheet button:focus-visible, .sheet a:focus-visible { outline-color: #5147E5; outline-offset: 1px; }

      footer {
        padding: 48px 16px 32px;
        text-align: center;
        color: rgba(255, 255, 255, .85);
        font-size: 12px;
        line-height: 1.6;
      }

      /* Share sheet */
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .5);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s ease;
        z-index: 10;
      }

      .backdrop.open { opacity: 1; pointer-events: auto; }

      .sheet {
        width: 100%;
        max-width: 480px;
        background: #fff;
        border-radius: 24px 24px 0 0;
        padding: 20px 20px 28px;
        transform: translateY(100%);
        transition: transform .25s ease;
      }

      .backdrop.open .sheet { transform: none; }

      @media (min-width: 600px) {
        .backdrop { align-items: center; }
        .sheet { border-radius: 24px; }
      }

      .sheet-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .sheet-head h2 { font-size: 16px; font-weight: 600; }

      .close {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 9999px;
      }

      .close:hover { background: #f1f1f1; }
      .close svg { width: 18px; height: 18px; }

      .preview {
        background: #5147E5;
        color: #fff;
        border-radius: 16px;
        padding: 20px 16px;
        text-align: center;
        margin-bottom: 16px;
      }

      .preview-logo { display: block; width: 56px; height: 56px; margin: 0 auto 8px; border-radius: 9999px; }
      .preview strong { display: block; font-size: 16px; font-weight: 600; }
      .preview span { display: block; margin-top: 4px; font-size: 12px; opacity: .85; word-break: break-all; }

      .options { display: flex; flex-direction: column; gap: 4px; }

      .option {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        color: #010101;
        text-decoration: none;
        text-align: left;
      }

      .option:hover { background: #f3f3f1; }

      .option .ico {
        width: 36px;
        height: 36px;
        border-radius: 9999px;
        display: grid;
        place-items: center;
        background: #f3f3f1;
        flex: none;
      }

      .option .ico svg { width: 18px; height: 18px; }


      /* Shine animation */
      .avatar-wrap { position: relative; width: 96px; height: 96px; }
      .trace {
        position: absolute;
        pointer-events: none;
        overflow: visible;
        opacity: 0;
      }
      .avatar-wrap .trace { inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); }
      .link .trace { inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); }
      .trace * {
        fill: none;
        stroke: #fff;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 1 1;
        stroke-dashoffset: 1;
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, .9));
      }
      .icon-btn[aria-busy="true"] { cursor: default; opacity: .6; }
      .icon-btn[aria-busy="true"] svg { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }


      /* Signature: line drops from last link, then writes the name */
      .signature {
        position: relative;
        width: 100%;
        height: calc(62px + min(320px, 86vw) * 0.381 + 24px);
        margin-top: 8px;
        pointer-events: none;
      }
      .signature svg { position: absolute; overflow: visible; opacity: 0; }
      .signature .drop { left: calc(50% - 2px); top: 0; width: 4px; height: 92px; }
      .signature .sig { left: 50%; top: 62px; width: min(320px, 86%); aspect-ratio: 7289 / 2779; transform: translateX(-50%); }
      .signature path {
        fill: #fff;
        fill-opacity: 0;
        stroke: #fff;
        stroke-width: 1.6;
        vector-effect: non-scaling-stroke;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1 1;
        stroke-dashoffset: 1;
        filter: drop-shadow(0 0 3px rgba(255, 255, 255, .8));
      }
      .signature .drop path { stroke-width: 3; }

      [hidden] { display: none !important; }

      @media (prefers-reduced-motion: reduce) {
        .link, .button, .backdrop, .sheet { transition: none; }
      }
    </style>

    <script>
      (function () {
        var backdrop = document.getElementById('share');
        var nameEl = document.getElementById('share-name');
        var urlEl = document.getElementById('share-url');
        var copyLabel = document.getElementById('copy-label');
        var native = document.getElementById('opt-native');
        var current = { title: '', url: '' };
        var lastFocus = null;

        document.getElementById('year').textContent = new Date().getFullYear();
        if (navigator.share) native.hidden = false;

        function open(title, url) {
          current = { title: title, url: url };
          var text = encodeURIComponent(title + ' ' + url);
          nameEl.textContent = title;
          urlEl.textContent = url.replace(/^https?:\/\//, '');
          copyLabel.textContent = 'Copiar link';
          document.getElementById('opt-whatsapp').href = 'https://wa.me/?text=' + text;
          document.getElementById('opt-facebook').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
          document.getElementById('opt-x').href = 'https://x.com/intent/post?text=' + text;
          document.getElementById('opt-email').href = 'mailto:?subject=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(url);
          lastFocus = document.activeElement;
          backdrop.classList.add('open');
          backdrop.setAttribute('aria-hidden', 'false');
          backdrop.querySelector('.close').focus();
        }

        function close() {
          backdrop.classList.remove('open');
          backdrop.setAttribute('aria-hidden', 'true');
          if (lastFocus) lastFocus.focus();
        }

        document.querySelectorAll('[data-share-page]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            open('Seven Biz Solutions', location.href.split('#')[0]);
          });
        });

        document.querySelectorAll('.more').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var a = btn.parentElement.querySelector('a');
            open(a.textContent.trim(), a.href);
          });
        });

        backdrop.querySelector('.close').addEventListener('click', close);
        backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && backdrop.classList.contains('open')) close();
        });

        document.getElementById('opt-copy').addEventListener('click', function () {
          var done = function () { copyLabel.textContent = 'Link copiado!'; };
          if (navigator.clipboard) {
            navigator.clipboard.writeText(current.url).then(done);
          } else {
            var t = document.createElement('textarea');
            t.value = current.url;
            document.body.appendChild(t);
            t.select();
            document.execCommand('copy');
            t.remove();
            done();
          }
        });

        native.addEventListener('click', function () {
          navigator.share({ title: current.title, url: current.url }).catch(function () {});
        });

        // Shine: traces a glowing border around avatar, then each link
        var shine = document.getElementById('shine');
        var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

        document.querySelectorAll('.link').forEach(function (link) {
          var ns = 'http://www.w3.org/2000/svg';
          var svg = document.createElementNS(ns, 'svg');
          svg.setAttribute('class', 'trace');
          svg.setAttribute('aria-hidden', 'true');
          var r = document.createElementNS(ns, 'rect');
          r.setAttribute('pathLength', '1');
          svg.appendChild(r);
          link.appendChild(svg);
        });

        function sizeRects() {
          document.querySelectorAll('.link .trace').forEach(function (svg) {
            var w = svg.parentElement.offsetWidth + 10, h = svg.parentElement.offsetHeight + 10;
            svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
            var r = svg.firstChild;
            r.setAttribute('x', 1.5); r.setAttribute('y', 1.5);
            r.setAttribute('width', w - 3); r.setAttribute('height', h - 3);
            r.setAttribute('rx', 20);
          });
        }

        function trace(svg, ms) {
          svg.style.opacity = 1;
          return svg.firstElementChild.animate(
            [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
            { duration: ms, easing: 'ease-in-out', fill: 'forwards' }
          ).finished;
        }

        shine.addEventListener('click', function () {
          if (shine.getAttribute('aria-busy') === 'true') return;
          shine.setAttribute('aria-busy', 'true');
          shine.disabled = true;
          sizeRects();
          var svgs = [document.querySelector('.avatar-wrap .trace')].concat([].slice.call(document.querySelectorAll('.link .trace')));
          var k = reduce ? 0.3 : 1;
          var chain = trace(svgs[0], 900 * k);
          svgs.slice(1).forEach(function (svg) {
            chain = chain.then(function () { return trace(svg, 700 * k); });
          });
          var sig = document.querySelector('.signature');
          var drop = sig.querySelector('.drop');
          var sigSvg = sig.querySelector('.sig');
          var glyphs = [].slice.call(sigSvg.querySelectorAll('path'));
          var anims = [];
          function keep(a) { anims.push(a); return a.finished; }

          chain = chain.then(function () {
            drop.style.opacity = 1;
            return keep(drop.firstElementChild.animate(
              [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
              { duration: 500 * k, easing: 'ease-in', fill: 'forwards' }));
          }).then(function () {
            sigSvg.style.opacity = 1;
            keep(drop.firstElementChild.animate(
              [{ strokeDashoffset: 0 }, { strokeDashoffset: -1 }],
              { duration: 400 * k, easing: 'ease-out', fill: 'forwards' }));
            var t = 0, dur = 420 * k, prevGroup = null;
            return Promise.all(glyphs.map(function (g) {
              var group = g.parentNode;
              if (prevGroup && group !== prevGroup) t += 250 * k;
              prevGroup = group;
              var delay = t;
              t += Number(group.dataset.step) * k;
              return keep(g.animate(
                [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
                { duration: dur, delay: delay, easing: 'ease-in-out', fill: 'forwards' }));
            }));
          }).then(function () {
            return Promise.all(glyphs.map(function (g) {
              return keep(g.animate([{ fillOpacity: 0 }, { fillOpacity: 1 }], { duration: 500 * k, fill: 'forwards' }));
            }));
          }).then(function () {
            return new Promise(function (r) { setTimeout(r, 1200 * k); });
          });

          var all = svgs.concat([drop, sigSvg]);
          chain.then(function () {
            return Promise.all(all.map(function (svg) {
              return keep(svg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400 * k, fill: 'forwards' }));
            }));
          }).then(function () {
            anims.forEach(function (a) { a.cancel(); });
            all.forEach(function (svg) {
              svg.getAnimations().forEach(function (a) { a.cancel(); });
              svg.firstElementChild.getAnimations().forEach(function (a) { a.cancel(); });
              svg.style.opacity = 0;
            });
            shine.disabled = false;
            shine.removeAttribute('aria-busy');
          });
        });
      })();
    </script>
  </body>
</html>
