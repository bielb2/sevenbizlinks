<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seven Biz Solutions</title>
    <link rel="icon" type="image/png" href="images/avatar-seven.png">
    <meta name="description" content="Links oficiais da Seven Biz Solutions: Loja Shopee e Meu Planejamento Facial.">
    <meta name="theme-color" content="#5147E5">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Seven Biz Solutions">
    <meta property="og:description" content="Loja Shopee e Meu Planejamento Facial.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600&display=swap">

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        min-height: 100%;
        background: #5147E5;
      }

      body {
        font-family: "Red Hat Display", system-ui, sans-serif;
        color: #010101;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 580px;
        margin: 0 auto;
        padding: 72px 16px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .avatar {
        width: 96px;
        height: 96px;
        border-radius: 9999px;
        object-fit: contain;
      }

      h1 {
        margin-top: 16px;
        color: #fff;
        font-size: 24px;
        font-weight: 600;
        line-height: 1.3;
        text-align: center;
      }

      nav {
        width: 100%;
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 64px;
        padding: 12px 32px;
        background: #fff;
        color: #010101;
        border: 1.75px solid #000;
        border-radius: 16px;
        box-shadow: 3px 4px 0 0 #000;
        font-size: 14px;
        font-weight: 500;
        text-align: center;
        text-decoration: none;
        transition: transform .12s ease, box-shadow .12s ease;
      }

      .button:hover {
        transform: translate(-1px, -1px);
        box-shadow: 4px 5px 0 0 #000;
      }

      .button:active {
        transform: translate(3px, 4px);
        box-shadow: 0 0 0 0 #000;
      }

      .button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .button { transition: none; }
      }
    </style>
  </head>

  <body>
    <main>
      <img class="avatar" src="images/avatar-seven.png" alt="Logo Seven Biz Solutions" width="96" height="96">
      <h1>Seven Biz Solutions</h1>

      <nav aria-label="Links">
        <a class="button" href="https://shopee.com.br/sevenbizhardware#product_list" target="_blank" rel="noopener">Loja Shopee</a>
        <a class="button" href="https://www.meuplanejamentofacial.com" target="_blank" rel="noopener">Meu Planejamento Facial</a>
      </nav>
    </main>
  </body>
</html>
